
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#e6f8e8">

  <title>Таза Қазақстан | BY DARKHAN</title>

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="script.js" defer></script>
</head>

<body>

  <!-- ЖАСЫЛ ТАБИҒАТ ФОНЫ -->
  <div class="nature-background"></div>

  <!-- ЖОҒАРҒЫ МӘЗІР -->
  <header class="header">

    <button class="brand" onclick="showHome()">
      <span class="logo">✿</span>

      <span class="brand-text">
        <strong>ТАЗА ҚАЗАҚСТАН</strong>
        <small>АШЫҚ ТӘРБИЕ САҒАТЫ · 1-КУРС</small>
      </span>
    </button>

    <nav class="navigation">

      <button onclick="showHome()">
        Басты бет
      </button>

      <button onclick="showSlide(0)">
        Түсіндірме
      </button>

      <button onclick="showGame(0)">
        Командалық ойын
      </button>

    </nav>

    <div class="header-tools">

      <span id="phase">ТҮСІНДІРУ</span>

      <strong id="clock">15:00</strong>

      <button class="icon-button"
              id="timerButton"
              onclick="toggleTimer()"
              title="Таймерді тоқтату немесе бастау">
        ▶
      </button>

      <button class="icon-button"
              onclick="toggleFullscreen()"
              title="Толық экран">
        ⛶
      </button>

    </div>

  </header>

  <!-- БЕТТЕРДІ JAVASCRIPT АУЫСТЫРАДЫ -->
  <main id="app"></main>

  <!-- АВТОР -->
  <footer class="footer">
    <span>
      ТАБИҒАТ · ТАЗАЛЫҚ · ЖАУАПКЕРШІЛІК
    </span>

    <strong>BY DARKHAN</strong>
  </footer>

</body>
</html>
